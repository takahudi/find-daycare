minimumReleaseAge: 4320

allowBuilds:
  # fsevents ships a prebuilt fsevents.node; its install script only rebuilds it with node-gyp
  fsevents: false
  # The prepare script runs `lefthook install` instead
  lefthook: false
  # esbuild resolves its optional platform binary without the install-time optimization
  esbuild: false
  # workerd resolves its optional platform binary without the install-time optimization
  workerd: false
