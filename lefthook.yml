pre-commit:
  piped: true
  jobs:
    - name: lint
      glob: '*.{js,mjs,cjs,ts,tsx}'
      run: pnpm lint --fix {staged_files}
      stage_fixed: true
    - name: lint-css
      glob: '*.css'
      run: pnpm exec stylelint --fix {staged_files}
      stage_fixed: true
    - name: actionlint
      glob: '.github/workflows/*.{yml,yaml}'
      run: actionlint {staged_files}
    - name: format
      glob: '*.{js,mjs,cjs,ts,tsx,json,jsonc,css,html,yaml,yml}'
      run: pnpm format --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
